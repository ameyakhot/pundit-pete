name: Daily AI Consultant Post

on:
  schedule:
    # Runs at 12:30 UTC everyday (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push history.json updates

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Post Bot
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONPATH: .
        run: |
          python src/main.py

      - name: Commit History
        run: |
          git config --global user.name 'QuantumBot'
          git config --global user.email 'bot@noreply.github.com'
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update post history [skip ci]" && git push)

